        function stopLiveGPS() {
            if (gpsWatchId !== null && navigator.geolocation) {
                navigator.geolocation.clearWatch(gpsWatchId);

            }

        gpsStartBtn.addEventListener('click', function() {
            if (!('geolocation' in navigator)) {
                gpsStatusEl.textContent = 'این مرورگر از GPS پشتیبانی نمی‌کند.';
                return;
            }
            if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                gpsStatusEl.textContent = 'برای GPS زنده، نقشه را از طریق HTTPS اجرا کنید.';
                return;
            }
            if (gpsWatchId !== null) return;
            gpsFirstFix = true;
            gpsStatusEl.textContent = 'در حال دریافت موقعیت GPS…';
            gpsStartBtn.style.display = 'none';
            gpsStopBtn.style.display = '';
            gpsWatchId = navigator.geolocation.watchPosition(function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                var accuracy = position.coords.accuracy || 0;
                var current = L.latLng(lat, lng);
                if (!gpsMarker) {

                } else {

                }

        });
        if(southWestVertex){
            L.marker(southWestVertex,{icon:L.divIcon({className:'',html:'<div class="start-point"></div>',iconSize:[19,19],iconAnchor:[9,9]}),title:'نقطه شروع تقریبی جنوب‌غربی'}).addTo(map).bindPopup('نقطه شروع تقریبی جنوب‌غربی حوزه');
        }

        // مسیریابی از GPS فعلی به مرکز بلوک انتخاب‌شده یا مقصدی که روی نقشه انتخاب شود
        map.on('click',function(e){ routeTarget=e.latlng; routeInfo.textContent='مقصد مسیر انتخاب شد؛ برای مسیریابی خودرو یا پیاده بزنید.'; });
        function drawRoute(profile){
            if(!gpsMarker){routeInfo.textContent='ابتدا ثبت موقعیت زنده GPS را فعال کنید.';return;}
            var target=routeTarget || (activeBlock ? activeBlock.layer.getBounds().getCenter() : null);
            if(!target){routeInfo.textContent='یک بلوک انتخاب کنید یا مقصد را روی نقشه لمس کنید.';return;}
            var start=gpsMarker.getLatLng();
            var url='https://router.project-osrm.org/route/v1/'+profile+'/'+start.lng+','+start.lat+';'+target.lng+','+target.lat+'?overview=full&geometries=geojson';
            routeInfo.textContent='در حال محاسبه مسیر…';
            fetch(url).then(function(r){if(!r.ok)throw new Error('خطای سرویس مسیر');return r.json();}).then(function(data){
                if(!data.routes || !data.routes.length) throw new Error('مسیری پیدا نشد');
                if(routeLayer) map.removeLayer(routeLayer);
                var r=data.routes[0]; routeLayer=L.geoJSON(r.geometry,{style:{color:profile==='driving'?'#1565c0':'#2e7d32',weight:5,opacity:.85}}).addTo(map);
                map.fitBounds(routeLayer.getBounds().pad(.15));
                var km=(r.distance/1000).toFixed(2), mins=Math.round(r.duration/60);
                routeInfo.textContent='مسافت: '+km+' کیلومتر | زمان تخمینی: '+mins+' دقیقه (بدون تضمین ترافیک زنده)';
            }).catch(function(err){routeInfo.textContent='مسیریابی انجام نشد: '+err.message+'؛ اتصال اینترنت یا سرویس مسیر را بررسی کنید.';});
        }
        document.getElementById('carRoute').addEventListener('click',function(){drawRoute('driving');});
        document.getElementById('footRoute').addEventListener('click',function(){drawRoute('walking');});
        document.getElementById('clearRoute').addEventListener('click',function(){if(routeLayer)map.removeLayer(routeLayer);routeLayer=null;routeTarget=null;routeInfo.textContent='مسیر پاک شد.';});

        // قطب‌نمای دستگاه؛ پشتیبانی و مجوز آن وابسته به مرورگر است
        function handleOrientation(e){ var heading = (typeof e.webkitCompassHeading==='number') ? e.webkitCompassHeading : (typeof e.alpha==='number' ? 360-e.alpha : null); if(heading!==null) document.getElementById('compassNeedle').style.transform='rotate('+heading+'deg)'; }
        if(window.DeviceOrientationEvent){ window.addEventListener('deviceorientation',handleOrientation,true); }
        document.getElementById('compassNeedle').parentElement.addEventListener('click',function(){
            if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
                DeviceOrientationEvent.requestPermission().then(function(state){if(state==='granted')window.addEventListener('deviceorientation',handleOrientation,true);}).catch(function(){});
            }
        });
        
        </script>
    </body>
</html>
