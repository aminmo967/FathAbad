        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        // ردیابی زنده GPS: با watchPosition موقعیت کاربر به طور پیوسته به‌روز می‌شود.
        var gpsWatchId = null;
        var gpsMarker = null;
        var gpsAccuracyCircle = null;
        var gpsFirstFix = true;
        var gpsStatusEl = document.getElementById('gpsStatus');
        var gpsStartBtn = document.getElementById('gpsStart');
        var gpsStopBtn = document.getElementById('gpsStop');
        var gpsIcon = L.divIcon({className: '', html: '<div class="gps-dot"></div>', iconSize: [22,22], iconAnchor: [11,11]});

        function stopLiveGPS() {
            if (gpsWatchId !== null && navigator.geolocation) {
                navigator.geolocation.clearWatch(gpsWatchId);
                gpsWatchId = null;
            }
            gpsStartBtn.style.display = '';
            gpsStopBtn.style.display = 'none';
            gpsStatusEl.textContent = gpsMarker ? 'وضعیت: ردیابی متوقف شد' : 'وضعیت: GPS غیرفعال است';
        }

        gpsStartBtn.addEventListener('click', function() {
            if (!('geolocation' in navigator)) {
                gpsStatusEl.textContent = 'این مرورگر از GPS پشتیبانی نمی‌کند.';
                return;
            }
            if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                gpsStatusEl.textContent = 'برای GPS زنده، نقشه را از طریق HTTPS اجرا کنید.';
                return;
            }
            if (gpsWatchId !== null) return;
            gpsFirstFix = true;
            gpsStatusEl.textContent = 'در حال دریافت موقعیت GPS…';
            gpsStartBtn.style.display = 'none';
            gpsStopBtn.style.display = '';
            gpsWatchId = navigator.geolocation.watchPosition(function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                var accuracy = position.coords.accuracy || 0;
                var current = L.latLng(lat, lng);
                if (!gpsMarker) {
                    gpsMarker = L.marker(current, {icon: gpsIcon, title: 'موقعیت زنده شما', zIndexOffset: 1000}).addTo(map);
                    gpsMarker.bindPopup('موقعیت فعلی شما');
                } else {
                    gpsMarker.setLatLng(current);
                }
                if (!gpsAccuracyCircle) {
                    gpsAccuracyCircle = L.circle(current, {radius: accuracy, color: '#1688ff', weight: 1, fillColor: '#1688ff', fillOpacity: 0.12}).addTo(map);
                } else {
                    gpsAccuracyCircle.setLatLng(current);
                    gpsAccuracyCircle.setRadius(accuracy);
                }
                if (gpsFirstFix) {
                    map.setView(current, Math.max(map.getZoom(), 17));
                    gpsFirstFix = false;
                } else {
                    map.panTo(current, {animate: true, duration: 0.4});
                }
                gpsStatusEl.textContent = 'GPS فعال | دقت تقریبی: ' + Math.round(accuracy) + ' متر';
            }, function(error) {
                var message = 'خطا در دریافت موقعیت GPS';
                if (error.code === 1) message = 'دسترسی مکان‌یابی رد شده است؛ مجوز GPS مرورگر را فعال کنید.';
                else if (error.code === 2) message = 'موقعیت فعلاً در دسترس نیست؛ GPS دستگاه را بررسی کنید.';
                else if (error.code === 3) message = 'زمان دریافت موقعیت به پایان رسید؛ دوباره تلاش کنید.';
                gpsStatusEl.textContent = message;
                stopLiveGPS();
            }, {enableHighAccuracy: true, maximumAge: 1000, timeout: 20000});
        });
        gpsStopBtn.addEventListener('click', stopLiveGPS);
        window.addEventListener('pagehide', stopLiveGPS);
